<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Syscordle-ng</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<h1>Syscordle-ng</h1>

<div id="notice"></div>
<div id="board"></div>
<div id="stats-button-container"></div>
<div id="keyboard"></div>

<!-- Stats Modal -->
<div id="stats-modal" class="modal">
  <div class="modal-content">
    <h2>Statistics</h2>
    <div id="stats-overview">
      Played Games: <span id="stat-played"></span><br>
      Win %: <span id="stat-winpct"></span><br>
      Current Streak: <span id="stat-current"></span><br>
      Max Streak: <span id="stat-max"></span>
    </div>

    <h3>Guess Distribution</h3>
    <div id="guess-dist">
      <!-- guess bars here -->
    </div>

    <button id="share-btn">Share</button>
    <button id="close-stats">Close</button>
    <button id="reset-stats-btn">Reset</button>

  </div>
</div>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
