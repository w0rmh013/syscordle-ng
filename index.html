<body>
<div id="scale-container">
<h1>syscordle_ng</h1>
    <p id="syscall-note">
      all syscalls are taken from <a href="https://raw.githubusercontent.com/torvalds/linux/refs/tags/v6.17/arch/x86/entry/syscalls/syscall_64.tbl" target="_blank" rel="noopener noreferrer">here</a>
    </p>

    <p id="bug-report">
      encountered a bug? report on <a href="https://github.com/w0rmh013/syscordle-ng/issues" target="_blank">GitHub</a>
    </p>

    <div id="board-container">
      <div id="board"></div>
      <div id="notice"></div> <!-- notice inside board container -->
    </div>
    <div id="stats-button-container"></div>
    <div id="keyboard"></div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="modal">
      <div class="modal-content">
        <h2>Statistics</h2>
        <div id="daily-answer">
          <h4>Today's answer: <span id="daily-answer-text"></span></h4>
        </div>
        <div id="stats-overview">
          Played Games: <span id="stat-played"></span><br>
          Win %: <span id="stat-winpct"></span><br>
          Current Streak: <span id="stat-current"></span><br>
          Max Streak: <span id="stat-max"></span>
        </div>

        <h3>Guess Distribution</h3>
        <div id="guess-dist">
          <div class="guess-bar" data-tries="1"><span>1</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="2"><span>2</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="3"><span>3</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="4"><span>4</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="5"><span>5</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="6"><span>6</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
          <div class="guess-bar" data-tries="fail"><span>X</span><div class="bar"><div class="fill"></div><span class="bar-value">0</span></div></div>
        </div>

        <button id="share-btn">Share</button>
        <button id="close-stats">Close</button>
        <button id="reset-stats-btn">Reset</button>

      </div>
    </div>
</div>
</body>
</html>
