<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Client-side Wordle — Daily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Wordle — Daily (client)</h1>
      <div class="stats">
        <div><strong id="played">0</strong><span>Played</span></div>
        <div><strong id="wins">0</strong><span>Wins</span></div>
        <div><strong id="streak">0</strong><span>Streak</span></div>
      </div>
    </header>

    <section id="board" class="board" aria-live="polite"></section>

    <section class="controls">
      <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>

      <div id="side" class="side">
        <div id="numpad" class="numpad" aria-label="Numpad"></div>
        <div class="side-buttons">
          <button id="enterKey" class="key action enter">Enter</button>
          <button id="backKey" class="key action back">⌫</button>
        </div>
      </div>
    </section>

    <div id="notice" class="notice" aria-live="assertive"></div>

    <footer class="footer">
      <small>All client-side — words come from <code>words.js</code></small>
    </footer>
  </main>

  <!-- load words file first -->
  <script src="words.js"></script>
  <!-- main logic -->
  <script src="script.js"></script>
</body>
</html>
