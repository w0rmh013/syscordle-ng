<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Client-side Wordle — Centered Keyboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Wordle — Daily</h1>

    <!-- Board -->
    <div id="board" class="board" aria-live="polite"></div>

    <!-- Keyboard container: width matches board and is centered -->
    <div id="keyboard-container" class="keyboard-container">
      <div id="keyboard" class="keyboard"></div>

      <!-- numpad centered below the keyboard -->
      <div id="numpad" class="numpad"></div>
    </div>

    <div id="notice" class="notice" aria-live="assertive"></div>
  </main>

  <!-- words must load first -->
  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
